name: Update model catalogue

# Keeps src/lib/models.js fresh automatically: adds newly released OpenRouter models
# and drops ones a provider removed. Runs daily and on manual dispatch. Commits the
# diff straight to the default branch when something changed.

on:
  schedule:
    - cron: "17 6 * * *" # daily, ~06:17 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # This job commits and pushes the refreshed catalogue, so it keeps the
          # token; it uploads no artifact, so the credential cannot leak through one.
          persist-credentials: true # zizmor: ignore[artipacked]

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Refresh OpenRouter model catalogue
        run: node scripts/update-models.mjs

      - name: Commit changes (if any)
        run: |
          # hivey-models.js too: the script also re-curates the 🐝 Hivey per-role assignments,
          # and staging only models.js silently threw those bumps away.
          FILES=(src/lib/models.js src/lib/hivey-models.js)
          if [[ -n "$(git status --porcelain "${FILES[@]}")" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "${FILES[@]}"
            git commit -m "chore(models): daily auto-update from OpenRouter catalogue"
            git push
          else
            echo "No model changes today."
          fi
