name: Update model catalogue

# Keeps src/lib/models.js fresh automatically: adds newly released OpenRouter models and drops ones
# a provider removed. Runs daily and on manual dispatch.
#
# The refresh lands as a pull request, merged once main's required checks have passed on it — main
# is protected, so a direct push is refused. CI and the security baseline are started on it by hand
# (a PR opened with the job's token starts no workflow) — see scripts/land-catalogue.sh.

on:
  schedule:
    - cron: "17 6 * * *" # daily, ~06:17 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  actions: write
  checks: read
  # Recording the verified results on the commit, where the merge can see them.
  statuses: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job commits and pushes the refreshed catalogue, so it keeps the
          # token; it uploads no artifact, so the credential cannot leak through one.
          persist-credentials: true # zizmor: ignore[artipacked]

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Refresh OpenRouter model catalogue
        run: node scripts/update-models.mjs

      - name: Land the changes (if any)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # hivey-models.js too: the script also re-curates the 🐝 Hivey per-role assignments,
          # and staging only models.js silently threw those bumps away.
          FILES=(src/lib/models.js src/lib/hivey-models.js src/lib/model-catalog.generated.js)
          if [[ -n "$(git status --porcelain "${FILES[@]}")" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "${FILES[@]}"
            git commit -m "chore(models): daily auto-update from OpenRouter catalogue"
            bash scripts/land-catalogue.sh
          else
            echo "No model changes today."
          fi
