# Gitleaks configuration (read by the "security / Secret scanning" job).
# Keep every default rule; only exempt files whose matches are known not to be secrets.
[extend]
useDefault = true

[allowlist]
description = "Vendored minified third-party code (transformers.js), and the fake credentials used as fixtures by the redaction tests"
paths = ['''^vendor/''', '''^tests/(redaction|businessData|redactionFalsePositives|privacy)\.test\.js$''']
